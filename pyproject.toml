[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tokenmaxxing"

[project]
name = "tokenmaxxing"
version = "0.1.0"
description = "Local metadata-only agent usage accounting"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Tokenmaxxing contributors" },
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "rich>=15,<16",
    "tzdata>=2025.2",
    "tzlocal>=5,<6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
keywords = ["agent", "claude-code", "codex", "opencode", "pi", "tokens", "usage"]

[project.urls]
Homepage = "https://github.com/anjay-goel/tokenmaxxing"
Documentation = "https://github.com/anjay-goel/tokenmaxxing#readme"
Repository = "https://github.com/anjay-goel/tokenmaxxing"
Issues = "https://github.com/anjay-goel/tokenmaxxing/issues"
License = "https://spdx.org/licenses/MIT.html"

[project.scripts]
tokenmaxxing = "tokenmaxxing.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
